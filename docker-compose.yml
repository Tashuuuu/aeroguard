services:
  api:
    build: .
    ports: ["8000:8000"]
    volumes:
      - ./workspace/processed:/app/workspace/processed
      - ./workspace/artifacts:/app/workspace/artifacts
  dashboard:
    build: .
    command: streamlit run app/dashboard.py --server.port 8501 --server.address 0.0.0.0
    environment: [API_URL=http://api:8000]
    ports: ["8501:8501"]
    depends_on: [api]